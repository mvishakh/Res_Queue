# Local-only services for running the automated test suite and the Celery worker
# offline. Production uses Supabase PostgreSQL and Upstash Redis — not these containers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartqueue
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
